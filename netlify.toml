[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Refresh fix: any path that isn't a real file loads the app instead of a 404.
# Safe for /api/ai, because Netlify runs functions before redirect rules.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must always be re-checked so updates reach installed phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
