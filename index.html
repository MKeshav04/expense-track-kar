<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kharcha</title>
    <meta name="description" content="A simple expense track-kar. Type 150 food and you're done." />
    <meta name="theme-color" content="#17140f" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved light/dark choice before anything is drawn (dark is the default).
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fff4e0')
        }
      } catch (e) {}

      // Self-repair: if the app hasn't started 10 seconds after loading (e.g. a phone stuck on an
      // old offline copy), clear the offline copy once and reload. Entries are never touched:
      // they live in IndexedDB, not in these caches. Runs at most once per session.
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (window.__kharchaStarted || !navigator.onLine) return
          try {
            if (sessionStorage.getItem('kharcha-repaired')) return
            sessionStorage.setItem('kharcha-repaired', '1')
          } catch (e) {
            return
          }
          var jobs = []
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister() }))
            }))
          }
          if (window.caches) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k) }))
            }))
          }
          Promise.all(jobs).then(reload, reload)
          function reload() { location.reload() }
        }, 10000)
      })
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Kharcha" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
